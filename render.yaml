services:
  - type: web
    name: kmj-erp
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
    autoDeploy: true
    plan: starter
    disk:
      mountPath: /var/data
      sizeGB: 1
