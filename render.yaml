services:
  - type: web
    name: kmj-erp
    env: node
    buildCommand: npm ci --include=dev && npm run build -w client && npm run build -w warehouse && npm run build -w server
    startCommand: cd server && node ./node_modules/.bin/prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_APP_URL
        value: https://kmjoptical.onrender.com
      - key: WAREHOUSE_APP_URL
        value: https://kmj-m9aq.onrender.com
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: JWT_ACCESS_EXPIRY
        value: 7d
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "500"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_CLUSTER
        value: "false"
      - key: CLUSTER_WORKERS
        value: "0"
    autoDeploy: true
    plan: free