services:
  - type: web
    name: kmj-erp
    env: node
    buildCommand: npm install && npm install --prefix client && npm install --prefix server && npm install --prefix warehouse && npm run build --prefix client && npm run build --prefix server && npm run build --prefix warehouse
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
    autoDeploy: true
    plan: starter
